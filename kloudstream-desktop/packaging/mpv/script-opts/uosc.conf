# uosc settings for KloudStream; the other options keep uosc's defaults (https://github.com/tomasklaen/uosc).
# A thick progress bar in the app's red, visible while paused, controls hidden with the cursor.
timeline_style=bar
timeline_size=46
timeline_persistency=paused
progress=always
progress_size=3
controls=subtitles,<has_many_audio>audio,<stream>stream-quality,gap,space,speed,gap,fullscreen
controls_size=34
top_bar_persistency=paused
autohide=yes
color=foreground=e50914,foreground_text=ffffff,background=000000,background_text=ffffff,curtain=111111
# French first: inherited from mpv's --slang, which the app sets to French.
languages=slang,en
