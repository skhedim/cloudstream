# uosc settings for KloudStream (https://github.com/tomasklaen/uosc): only its menus are used, the
# controls are scripts/kloudstream.lua. Rounded dark menus, the active item in white.
disable_elements=window_border,top_bar,timeline,controls,volume,pause_indicator,buffering_indicator,idle_indicator,audio_indicator
border_radius=14
menu_item_height=42
menu_min_width=320
menu_padding=8
color=foreground=ffffff,foreground_text=111111,background=1c1c1e,background_text=f2f2f2,curtain=000000
opacity=menu=0.97,curtain=0.5
# French first: inherited from mpv's --slang, which the app sets to French.
languages=slang,en
