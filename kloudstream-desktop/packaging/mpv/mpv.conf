# KloudStream's mpv (portable_config next to mpv.exe). scripts/kloudstream.lua draws the controls
# and uosc the menus, instead of mpv's OSC and bars.
osc=no
osd-bar=no
# The pointer hides with the controls.
cursor-autohide=2500
osd-font="Segoe UI"
# Text subtitles: a thinner outline with a soft shadow.
sub-font="Segoe UI Semibold"
sub-border-size=2.2
sub-shadow-offset=1.2
