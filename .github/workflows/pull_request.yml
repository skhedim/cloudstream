name: Pull request checks

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902" # SDK command-line tools 22.0
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: |
          sdk_version=$(sed -n 's/^compileSdk = "\([0-9]*\)"/\1/p' gradle/libs.versions.toml)
          if (( sdk_version >= 37 )); then sdk_version="$sdk_version.0"; fi
          sdkmanager "platforms;android-$sdk_version" 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v5
      - name: Configure runner memory
        run: |
          mkdir -p ~/.gradle
          printf '%s\n' 'org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8' 'kotlin.compiler.execution.strategy=in-process' >> ~/.gradle/gradle.properties
      - name: Check and build without release credentials
        run: ./gradlew :library:checkKotlinAbi :shared:jvmTest :app:testStableDebugUnitTest :app:assembleStableDebug --max-workers=2 --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: pull-request-build
          path: app/build/outputs/apk/stable/debug/*.apk
