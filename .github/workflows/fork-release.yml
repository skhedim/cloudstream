name: Fork release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'skhedim/cloudstream' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: |
          sdk_version=$(sed -n 's/^compileSdk = "\([0-9]*\)"/\1/p' gradle/libs.versions.toml)
          sdkmanager "platforms;android-$sdk_version" 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v5
      - name: Configure runner memory
        run: |
          mkdir -p ~/.gradle
          printf '%s\n' 'org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8' 'kotlin.compiler.execution.strategy=in-process' >> ~/.gradle/gradle.properties
      - name: Verify extension compatibility and run unit tests
        run: ./gradlew :library:checkKotlinAbi :shared:jvmTest :app:testStableDebugUnitTest --max-workers=2 --console=plain
      - name: Prepare private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FORK_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fork-release.keystore"
      - name: Build signed APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/fork-release.keystore
          SIGNING_KEY_ALIAS: ${{ secrets.FORK_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.FORK_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.FORK_STORE_PASSWORD }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          MDL_API_KEY: ${{ secrets.MDL_API_KEY }}
          MAL_KEY: ${{ secrets.MAL_KEY }}
          ANILIST_KEY: ${{ secrets.ANILIST_KEY }}
        run: |
          ./gradlew :app:assembleStableRelease -PforkVersionCode=$((1000000 + GITHUB_RUN_NUMBER)) -PforkVersionName="$VERSION_NAME" --max-workers=2 --console=plain
          mkdir -p dist
          cp app/build/outputs/apk/stable/release/app-stable-release.apk "dist/$VERSION_NAME.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "dist/$VERSION_NAME.apk"
          (cd dist && sha256sum "$VERSION_NAME.apk" > SHA256SUMS)
      - name: Publish public APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION_NAME"
          {
            printf 'CloudStream Skhedim %s\n\n' "$VERSION_NAME"
            printf 'Discover, aggregated search, canonical episodes and multi-provider playback.\n\n'
            printf 'Commit: %s\n\n' "$GITHUB_SHA"
            git log -1 --format='%s%n%n%b'
            printf '\nInstall the APK below. Future updates are offered in the app from this repository.\n'
          } > "$RUNNER_TEMP/release-notes.md"
          existing_draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$existing_draft" == false ]]; then
            echo 'This version is already published; dispatch a new run to publish another version.'
          else
            if [[ "$existing_draft" != true ]]; then
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "CloudStream Skhedim $VERSION_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" --draft
            fi
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "dist/$VERSION_NAME.apk#Android APK" dist/SHA256SUMS
            latest_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
            make_latest=true
            if [[ "$latest_tag" =~ ^v1\.0\.([0-9]+)$ ]] && (( BASH_REMATCH[1] > GITHUB_RUN_NUMBER )); then
              make_latest=false
            fi
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$make_latest"
          fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            shared/build/reports/tests/
          if-no-files-found: ignore
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/fork-release.keystore"
